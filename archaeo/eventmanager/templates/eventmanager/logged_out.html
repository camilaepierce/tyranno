{% extends 'base.html' %}

{% block title %}Logged Out - REX Events{% endblock %}
{% block page_title %}Logged Out{% endblock %}

{% block content %}
<div class="card">
    <div class="card-body text-center" style="padding: 2rem;">
        <p class="mb-3">You have been signed out of REX Events.</p>
        <div class="flex-between" style="justify-content: center; gap: 0.75rem; flex-wrap: wrap;">
            {% if oidc_enabled %}
            <a href="{% url 'oidc_authentication_init' %}" class="btn btn-primary">Log in with Touchstone</a>
            {% else %}
            <a href="{% url 'admin:login' %}" class="btn btn-primary">Log in</a>
            {% endif %}
            <a href="{% url 'index' %}" class="btn btn-secondary">Return to home</a>
        </div>
    </div>
</div>
{% endblock %}
